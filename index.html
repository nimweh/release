<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="释放">
<meta name="theme-color" content="#F6F3EE">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<title>释放</title>
<style>
:root{--bg:#F6F3EE;--card:#fff;--ink:#2B2A27;--mut:#7C7669;--line:#E4DED3;--acc:#2F6B5E;--accw:#E7F0ED}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Hiragino Sans GB",sans-serif;display:flex;justify-content:center;min-height:100vh}
#wrap{width:100%;max-width:520px;padding:calc(22px + env(safe-area-inset-top)) 20px calc(30px + env(safe-area-inset-bottom));min-height:100vh;display:flex;flex-direction:column}
h1{font-size:27px;font-weight:500;margin:0 0 8px;letter-spacing:.5px}
.sub{color:var(--mut);font-size:15px;margin:0 0 20px;line-height:1.7}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;min-height:22px}
.back{background:none;border:0;color:var(--mut);font:inherit;font-size:15px;padding:2px 0}
.bar{height:2px;background:var(--line);flex:1;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
.stage{font-size:12.5px;color:var(--acc);letter-spacing:.6px;margin:0 0 10px}
.ctx{font-size:14px;color:var(--mut);border-left:2px solid var(--line);padding:2px 0 2px 12px;margin:0 0 18px;word-break:break-word}
.lead{font-size:19px;line-height:1.65;margin:0 0 14px}
.q{font-size:20px;line-height:1.6;margin:0 0 18px}
.note{font-size:13.5px;color:var(--mut);line-height:1.65;margin:0 0 14px}
.guide{font-size:15.5px;line-height:1.72;margin:0 0 18px;padding:13px 15px;background:#FBF8F2;border:1px solid var(--line);border-radius:12px}
.spacer{flex:1;min-height:10px}
button.big{width:100%;border:0;border-radius:14px;background:var(--acc);color:#fff;font:inherit;font-size:17px;padding:16px;margin-top:10px}
button.big:disabled{opacity:.32}
button.row{width:100%;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;font-size:16.5px;padding:15px;margin-top:10px;text-align:left}
button.row b{font-weight:500}
button.row span{display:block;font-size:13.5px;color:var(--mut);margin-top:2px}
button.ghost{width:100%;border:1px solid var(--line);border-radius:14px;background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:14px;margin-top:10px}
button.mini{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font:inherit;font-size:14px;color:var(--ink)}
input,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:14px;font:inherit;color:var(--ink);background:var(--card);resize:none}
input:focus,textarea:focus{outline:2px solid var(--accw);border-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 18px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 16px;font:inherit;font-size:16px;color:var(--ink)}
.chip.on{border-color:var(--acc);background:var(--accw);color:#1E4E44}
.flist{margin:0 0 16px}
.fitem{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;margin:0 0 8px;font-size:16px}
.fitem i{flex:1;font-style:normal}
.fitem b{font-weight:400;color:var(--mut);font-size:18px;padding:0 4px}
.fitem .tag{font-size:12px;color:#1E4E44;background:var(--accw);border-radius:6px;padding:2px 8px}
.done{opacity:.55}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px;margin:0 0 18px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:10px 6px;text-align:left;vertical-align:top}
.tbl th{font-weight:500;color:var(--mut);font-size:13px}
.timer{font-size:34px;font-weight:500;text-align:center;margin:16px 0 8px;color:var(--acc);font-variant-numeric:tabular-nums}
.logitem{border-bottom:1px solid var(--line);padding:14px 0}
.logitem .d{font-size:12.5px;color:var(--mut);margin-bottom:4px}
.logitem .t{font-size:15px;margin-bottom:4px}
.logitem .n{font-size:15.5px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(26px + env(safe-area-inset-bottom));background:#2B2A27;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:80vw;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="wrap"></div>
<div id="toast"></div>
<script>
var CATS=["冷漠", "悲伤", "恐惧", "贪求", "愤怒", "骄傲", "勇气", "接纳", "平静"];
var WANTS=[["想要被认可", "想让谁觉得你好、怕他觉得你不好"], ["想要控制", "想把结果抓住、想让它按你的来"], ["想要安全", "怕失去什么、怕自己不安全"]];
var K='release_sessions_v2';

var S={topic:'',feelings:[],i:0,rounds:0,phase:'',note:'',stack:[]};
var W=document.getElementById('wrap');

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.className='on';clearTimeout(window._tt);window._tt=setTimeout(function(){t.className=''},1900)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function nl(s){return esc(s).replace(/\n/g,'<br>')}
function store(){
  var a=[];
  try{a=JSON.parse(localStorage.getItem(K)||'[]')}catch(e){a=[]}
  if(!a.length){
    try{
      var old=JSON.parse(localStorage.getItem('release_gains_v1')||'[]');
      if(old&&old.length){
        a=old.map(function(x){return {d:x.d,topic:x.t,note:x.n,rows:x.f?[{t:x.f,cat:'',want:''}]:[]}});
        try{localStorage.setItem(K,JSON.stringify(a))}catch(e){}
      }
    }catch(e){}
  }
  return a;
}
function save(a){try{localStorage.setItem(K,JSON.stringify(a))}catch(e){}}
function set(h){W.innerHTML=h;window.scrollTo(0,0)}

function bar(pct){
  return '<div class="top"><button class="back" onclick="back()">返回</button><div class="bar"><i style="width:'+pct+'%"></i></div></div>';
}
function back(){
  var p=S.stack.pop();
  if(!p){home();return}
  window[p.fn].apply(null,p.args||[]);
}
function go(fn,args,keep){
  if(!keep){S.stack.push({fn:fn,args:args||[]})}
  window[fn].apply(null,args||[]);
}
function pct(){
  var n=S.feelings.length||1;
  var base=14+(S.i/n)*72;
  if(S.phase==='want')base+=4;
  if(S.phase==='check')base+=6;
  return Math.min(96,Math.round(base));
}

function home(){
  S.stack=[];
  var h='<h1>释放</h1>';
  h+='<p class="sub">一件事牵出的感受，一条一条摊开——归到情绪，再归到底下的「想要」。<br>然后才放。</p>';
  h+='<button class="big" onclick="startNew()">开始梳理</button>';
  h+='<p class="note" style="margin-top:14px">放不掉的，中间会带你走一条慢的——不硬推，允许它留着。</p>';
  h+='<button class="ghost" onclick="go(\'dIntro\')">往源头上看一眼（深潜）</button>';
  h+='<p class="note">这条路不处理某件事。它从身体进，一路看到「想守住自己」这个动作，然后问一句：那个独立的「我」，找得到吗。</p>';
  h+='<button class="ghost" onclick="gains()">我记过的</button>';
  h+='<div class="note" style="margin-top:22px">这一套来自圣多纳释放法 1992 年原始课程：先认当下的感受，往上归到九类情绪，再归到「想要被认可／控制／安全」这三个根。<br><br>放掉一个类别，等于放掉它底下所有同类的感受，所以归类比细究有用。</div>';
  set(h);
}

function startNew(){
  S={topic:'',feelings:[],i:0,rounds:0,phase:'topic',note:'',stack:[]};
  go('topic');
}
function topic(){
  S.phase='topic';
  var h=bar(6);
  h+='<p class="stage">一 · 事情</p>';
  h+='<p class="q">现在想放下的是什么？</p>';
  h+='<p class="note">一件事、一个人、一个场面。越具体越好——最好不要是「我很焦虑」，而是「昨天开会时他那句话」。</p>';
  h+='<input id="ti" placeholder="和朋友闹崩了" value="'+esc(S.topic)+'">';
  h+='<div class="spacer"></div>';
  h+='<button class="big" onclick="setTopic()">下一步</button>';
  set(h);
}
function setTopic(){
  var v=(document.getElementById('ti').value||'').trim();
  if(!v){toast('写一句就够');return}
  S.topic=v;S.feelings=[];S.i=0;S.rounds=0;
  go('inventory',[],true);
}

function inventory(){
  S.phase='inv';
  var h=bar(12);
  h+='<div class="ctx">'+esc(S.topic)+'</div>';
  h+='<p class="stage">二 · 清点</p>';
  h+='<p class="lead">好。先不开工。</p>';
  h+='<div class="guide">先想那个最不舒服的瞬间——他说了哪句话，那几秒钟是什么样子。<br>然后把注意力收回来，放在自己身上。</div>';
  h+='<p class="q">这件事，让你有哪些感受？<br>一条一条说，能想到几条算几条。</p>';
  h+='<p class="note">不用挑，也不用排序。烦、怕、憋、不甘心、想哭、累——都算。<br>（说不清也行，写「说不上来」。）</p>';
  h+='<input id="fi" placeholder="此刻的一个感受，一个词就行" onkeydown="if(event.key===\'Enter\')addF()">';
  h+='<button class="mini" style="margin-top:10px" onclick="addF()">加一条</button>';
  h+=renderList(true);
  h+='<div class="spacer"></div>';
  h+='<button class="big" id="go" onclick="startLoop()">就这些，开始梳理</button>';
  set(h);
  var g=document.getElementById('go'); if(g)g.disabled=S.feelings.length===0;
}
function renderList(removable){
  if(!S.feelings.length)return '';
  var h='<div class="flist" style="margin-top:18px">';
  for(var i=0;i<S.feelings.length;i++){
    var f=S.feelings[i];
    h+='<div class="fitem'+(f.done?' done':'')+'"><i>'+esc(f.t)+'</i>'+
       (f.cat?'<span class="tag">'+esc(f.cat)+'</span>':'')+
       (removable?'<b onclick="delF('+i+')">×</b>':'')+'</div>';
  }
  return h+'</div>';
}
function addF(){
  var el=document.getElementById('fi');
  var v=(el.value||'').trim();
  if(!v){toast('写一个词就行');return}
  S.feelings.push({t:v,cat:'',want:'',rounds:0,done:false});
  el.value='';el.focus();
  var g=document.getElementById('go'); if(g)g.disabled=false;
  var box=W.querySelector('.flist');
  var html=renderList(true);
  if(box){box.outerHTML=html}else{
    var b=document.getElementById('go');
    b.insertAdjacentHTML('beforebegin',html);
  }
}
function delF(i){
  S.feelings.splice(i,1);
  var box=W.querySelector('.flist');
  var html=renderList(true);
  if(box){if(html){box.outerHTML=html}else{box.remove()}}
  var g=document.getElementById('go'); if(g)g.disabled=S.feelings.length===0;
}
function startLoop(){
  if(!S.feelings.length){toast('先写一条');return}
  S.i=0;S.rounds=0;
  go('allow');
}

function cur(){return S.feelings[S.i]}
function stageLine(){
  return '<p class="stage">第 '+(S.i+1)+' 条 / 共 '+S.feelings.length+' 条</p>';
}
function allow(){
  S.phase='allow';
  var f=cur();
  var h=bar(pct())+stageLine();
  h+='<p class="lead">好。先只看这一条。</p>';
  h+='<p class="q">让「'+esc(f.t)+'」就在那儿。<br>不赶它走，也别压回去。</p>';
  h+='<p class="note">不用想它从哪来，也不用解释。就让它在那儿。</p>';
  h+='<div class="spacer"></div>';
  h+='<button class="big" onclick="go(\'cat\')">能感觉到</button>';
  h+='<button class="ghost" onclick="go(\'slow0\')">有点难，慢一点来</button>';
  set(h);
}

function cat(){
  S.phase='cat';
  var f=cur();
  var h=bar(pct())+stageLine();
  h+='<div class="ctx">现在是：'+esc(f.t)+'</div>';
  h+='<p class="q">往回收一层——它更像下面哪一种？</p>';
  h+='<p class="note">凭第一反应，别分析。归到类别，是因为放掉一个类别，等于放掉它底下所有同类的感受。</p>';
  h+='<div class="chips">';
  for(var i=0;i<CATS.length;i++){
    h+='<button class="chip" onclick="pickCat(\''+CATS[i]+'\')">'+CATS[i]+'</button>';
  }
  h+='</div>';
  h+='<button class="ghost" onclick="pickCat(\'\')">说不上来，就身体上那块紧</button>';
  set(h);
}
function pickCat(c){
  cur().cat=c;
  if(c==='勇气'||c==='接纳'||c==='平静'){
    cur().pos=true;
    toast('这是好的那一侧——也放掉它，你可以更好');
    go('q1',[],true);
    return;
  }
  go('q1',[],true);
}

function qnum(){
  var f=cur();
  return f.rounds>0?'剩下的那部分，':'';
}
function q1(){
  S.phase='q';
  var f=cur();
  var label=f.cat||f.t;
  var h=bar(pct())+stageLine();
  h+='<div class="ctx">在放的是：'+esc(label)+'</div>';
  h+=(qnum()?'<p class="note">'+qnum()+'</p>':'');
  h+='<p class="q">你能允许它在吗？</p>';
  h+='<div class="spacer"></div>';
  h+='<button class="big" onclick="go(\'q2\')">能</button>';
  h+='<button class="ghost" onclick="toast(\'可以。答案不重要，往下走\');go(\'q2\')">不能</button>';
  set(h);
}
function q2(){
  S.phase='q';
  var f=cur();var label=f.cat||f.t;
  var h=bar(pct())+stageLine();
  h+='<div class="ctx">在放的是：'+esc(label)+'</div>';
  h+='<p class="q">你能放下它吗？</p>';
  h+='<div class="spacer"></div>';
  h+='<button class="big" onclick="go(\'q3\')">能</button>';
  h+='<button class="row" onclick="toast(\'可以，照样往下\');go(\'q3\')"><b>还不能</b></button>';
  h+='<button class="row" onclick="toast(\'不用想清楚\');go(\'q3\')"><b>说不清</b></button>';
  set(h);
}
function q3(){
  S.phase='q';
  var f=cur();var label=f.cat||f.t;
  var h=bar(pct())+stageLine();
  h+='<div class="ctx">在放的是：'+esc(label)+'</div>';
  h+='<p class="q">你愿意放下它吗？</p>';
  h+='<div class="spacer"></div>';
  h+='<button class="big" onclick="go(\'q4\')">愿意</button>';
  h+='<button class="row" onclick="toast(\'可以\');go(\'q4\')"><b>不愿意</b></button>';
  h+='<button class="row" onclick="toast(\'可以\');go(\'q4\')"><b>说不上</b></button>';
  set(h);
}
function q4(){
  S.phase='q';
  var f=cur();var label=f.cat||f.t;
  var h=bar(pct())+stageLine();
  h+='<div class="ctx">在放的是：'+esc(label)+'</div>';
  h+='<p class="q">什么时候？</p>';
  h+='<div class="spacer"></div>';
  h+='<button class="big" onclick="afterQ4()">现在</button>';
  h+='<button class="row" onclick="afterQ4()"><b>等一下</b></button>';
  h+='<button class="row" onclick="afterQ4()"><b>不知道</b></button>';
  set(h);
}
function afterQ4(){
  if(cur().pos){go('check',[],true);return}
  go('want',[],true);
}

function want(){
  S.phase='want';
  var f=cur();
  var h=bar(pct())+stageLine();
  h+='<div class="ctx">刚才放的是：'+esc(f.cat||f.t)+'</div>';
  h+='<p class="lead">这一条开始松了。再往下看一层。</p>';
  h+='<p class="q">「'+esc(f.t)+'」底下，通常是一个「想要」。<br>是哪一个？</p>';
  for(var i=0;i<WANTS.length;i++){
    h+='<button class="row" onclick="pickWant(\''+WANTS[i][0]+'\')"><b>'+WANTS[i][0]+'</b><span>'+WANTS[i][1]+'</span></button>';
  }
  h+='<button class="ghost" onclick="pickWant(\'说不清\')">说不清</button>';
  set(h);
}
function pickWant(w){
  cur().want=w;
  if(w==='说不清'){go('check',[],true);return}
  go('wantRel',[],true);
}
function wantRel(){
  S.phase='want';
  var f=cur();
  var h=bar(pct())+stageLine();
  h+='<div class="ctx">'+esc(f.t)+' → '+esc(f.want)+'</div>';
  h+='<p class="q">你能放下这个「'+esc(f.want)+'」吗？</p>';
  h+='<p class="note">认出来的那一瞬间，它常常自己就走了。不必凑满四个问题。</p>';
  h+='<div class="spacer"></div>';
  h+='<button class="big" onclick="go(\'check\')">能</button>';
  h+='<button class="ghost" onclick="go(\'check\')">还不能</button>';
  set(h);
}

function check(){
  S.phase='check';
  var f=cur();var label=f.cat||f.t;
  var h=bar(pct())+stageLine();
  h+='<div class="ctx">'+esc(f.t)+(f.want&&f.want!=='说不清'?' → '+esc(f.want):'')+'</div>';
  h+='<p class="lead">再回去看一眼。</p>';
  h+='<p class="q">「'+esc(f.t)+'」还剩多少？</p>';
  h+='<div class="spacer"></div>';
  h+='<button class="big" onclick="nextF(true)">没了</button>';
  h+='<button class="row" onclick="still()"><b>还有一点</b></button>';
  h+='<button class="row" onclick="still()"><b>还在</b></button>';
  set(h);
}
function still(){
  var f=cur();
  f.rounds++;
  if(f.rounds>=3){
    toast('剩下的先留着，回头再来看它');
    nextF(false);
    return;
  }
  if(f.rounds>=2){go('slow0',[],true);return}
  go('q1',[],true);
}

/* ── 慢放：放不下的情绪走这条，不硬推 ── */
function tm(sec){
  return '<div class="timer" id="tm">'+sec+'</div>'+
         '<button class="mini" onclick="startTimer('+sec+')">开始 '+sec+' 秒</button>';
}
function startTimer(sec){
  var el=document.getElementById('tm');var left=sec;
  if(window._ti)clearInterval(window._ti);
  el.textContent=left;
  window._ti=setInterval(function(){
    left--;
    if(left<0){clearInterval(window._ti);el.textContent='时间到';toast('可以往下点了');return}
    el.textContent=left;
  },1000);
}
function slowHead(step){
  var f=cur();
  return bar(pct())+'<p class="stage">慢一点 · '+step+'/6</p>'+
         '<div class="ctx">'+esc(f.t)+(f.cat?' → '+esc(f.cat):'')+'</div>';
}
function slow0(){
  S.phase='slow';
  var h=slowHead(1);
  h+='<p class="q">不命名。<br>就看着它。</p>';
  h+='<p class="note">不用告诉我它叫什么。不用分析它从哪来。</p>';
  h+=tm(30);
  h+='<div class="spacer"></div>';
  h+='<button class="big" onclick="go(\'slow1\')">看完了</button>';
  set(h);
}
function slow1(){
  S.phase='slow';
  var h=slowHead(2);
  h+='<p class="q">它在身体的哪儿？</p>';
  h+='<p class="note">胸、胃、喉咙、肩、后颈。哪儿都行。</p>';
  h+='<div class="chips" style="margin-top:14px">';
  var parts=['胸口','胃','喉咙','肩','后颈'];
  for(var i=0;i<parts.length;i++){
    h+='<button class="chip" onclick="pickBody(\''+parts[i]+'\')">'+parts[i]+'</button>';
  }
  h+='</div>';
  h+='<button class="ghost" onclick="pickBody(\'\')">哪儿都没有，就是一团</button>';
  set(h);
}
function pickBody(p){
  cur().body=p;
  go('slow2',[],true);
}
function slow2(){
  S.phase='slow';
  var f=cur();
  var h=slowHead(3);
  h+=(f.body?'<div class="ctx">在：'+esc(f.body)+'</div>':'');
  h+='<p class="q">允许那块地方是紧的。<br>不用它松开。</p>';
  h+='<p class="note">不是去放松肌肉。是允许它紧，然后松手。</p>';
  h+=tm(30);
  h+='<div class="spacer"></div>';
  h+='<button class="big" onclick="go(\'slow3\')">好</button>';
  set(h);
}
function slow3(){
  S.phase='slow';
  var h=slowHead(4);
  h+='<p class="q">现在，能放下它吗？</p>';
  h+='<p class="note">三个答案都可以。答「不能」也已经放掉一部分。</p>';
  h+='<div class="spacer"></div>';
  h+='<button class="big" onclick="go(\'slow4\')">能</button>';
  h+='<button class="row" onclick="go(\'slow4\')"><b>不能</b></button>';
  h+='<button class="row" onclick="go(\'slow4\')"><b>不知道</b></button>';
  set(h);
}
function slow4(){
  S.phase='slow';
  var h=slowHead(5);
  h+='<p class="q">再回去看一眼。<br>还紧吗？剩多少？</p>';
  h+='<p class="note">不管是什么答案，都接受。这一步不用做什么。</p>';
  h+='<div class="spacer"></div>';
  h+='<button class="big" onclick="go(\'slow5\')">看到了</button>';
  set(h);
}
function slow5(){
  S.phase='slow';
  var h=slowHead(6);
  h+='<p class="q">剩下的那部分，也允许它在。</p>';
  h+='<p class="lead" style="margin-top:6px">它可以留着。<br>你不用今天就把它解决掉。</p>';
  h+=tm(30);
  h+='<div class="spacer"></div>';
  h+='<button class="big" onclick="slowDone(true)">再看一眼这条</button>';
  h+='<button class="ghost" onclick="slowDone(false)">这条先放着，走下一题</button>';
  set(h);
}
function slowDone(recheck){
  var f=cur();
  if(recheck){
    if(!f.cat){go('cat',[],true);return}
    go('check',[],true);
    return;
  }
  nextF(false);
}
function nextF(clean){
  cur().done=true;
  cur().clean=!!clean;
  S.i++;
  S.rounds=0;
  if(S.i<S.feelings.length){go('allow',[],true)}
  else{go('review')}
}

function review(){
  S.phase='review';
  var h=bar(90);
  h+='<div class="ctx">'+esc(S.topic)+'</div>';
  h+='<p class="stage">回头</p>';
  h+='<p class="lead">'+S.feelings.length+' 条都过了一遍。</p>';
  h+='<p class="q">现在再想整件事——<br>那个场面。什么感觉？</p>';
  h+='<div class="spacer"></div>';
  h+='<button class="big" onclick="go(\'summary\')">松了，就这样</button>';
  h+='<button class="row" onclick="more()"><b>还有别的冒出来</b><span>再加几条，接着梳理</span></button>';
  h+='<button class="row" onclick="again()"><b>还剩一点，再走一轮</b><span>从第一条重新过一遍</span></button>';
  set(h);
}
function more(){
  for(var i=0;i<S.feelings.length;i++)S.feelings[i].done=true;
  go('inventory');
}
function again(){
  for(var i=0;i<S.feelings.length;i++){S.feelings[i].done=false;S.feelings[i].rounds=0}
  S.i=0;go('allow');
}

function summary(){
  S.phase='sum';
  var h=bar(97);
  h+='<h1 style="font-size:23px">梳理完了</h1>';
  h+='<div class="ctx">'+esc(S.topic)+'</div>';
  h+='<table class="tbl"><tr><th>感受</th><th>归到</th><th>底下的想要</th></tr>';
  for(var i=0;i<S.feelings.length;i++){
    var f=S.feelings[i];
    h+='<tr><td>'+esc(f.t)+'</td><td>'+esc(f.cat||'—')+'</td><td>'+esc(f.want||'—')+'</td></tr>';
  }
  h+='</table>';
  var left=0;
  for(var j=0;j<S.feelings.length;j++){if(S.feelings[j].clean===false)left++}
  if(left){h+='<p class="note">有 '+left+' 条只松了一点，还留着一些。这很正常——老议题很少一次放完，回头再来放它一次。</p>'}
  h+='<p class="note">注意看：几条不同的感受，最后常常收到同一个「想要」上。<br>那个想要，就是这套东西说的一直在把它推远的东西——<b>想要＝匮乏</b>。</p>';
  h+='<p class="q" style="font-size:18px;margin-top:6px">记一句收益：原来什么样，现在什么样。</p>';
  h+='<textarea id="nt" rows="3" placeholder="例：原来一想到就挂不住，现在想起来没什么了"></textarea>';
  h+='<button class="big" onclick="saveSession()">记下</button>';
  h+='<button class="ghost" onclick="home()">不记，结束</button>';
  set(h);
}
function saveSession(){
  var v=(document.getElementById('nt').value||'').trim();
  if(!v){toast('写一句就够，哪怕很短');return}
  var a=store();
  a.push({d:new Date().toLocaleDateString('zh-CN'),topic:S.topic,note:v,rows:S.feelings.map(function(f){return {t:f.t,cat:f.cat,want:f.want}})});
  save(a);
  toast('记下了');
  home();
}

function gains(){
  var a=store();var h=bar(100);
  h=h.replace('<button class="back" onclick="back()">返回</button>','<button class="back" onclick="home()">返回</button>');
  h+='<h1>我记过的</h1>';
  if(!a.length){h+='<p class="sub">还没有。梳理完记一句，慢慢能看出变化。</p>'}
  else{
    for(var i=a.length-1;i>=0;i--){
      var s=a[i];
      h+='<div class="logitem"><div class="d">'+esc(s.d)+'</div>'+
         (s.topic?'<div class="t">'+esc(s.topic)+'</div>':'')+
         '<div class="n">'+esc(s.note)+'</div>';
      if(s.rows&&s.rows.length){
        var line=s.rows.map(function(r){return r.t+(r.want&&r.want!=='说不清'?'→'+r.want:'')}).join('、');
        h+='<div class="d" style="margin-top:6px">'+esc(line)+'</div>';
      }
      h+='</div>';
    }
  }
  h+='<div class="spacer"></div><button class="ghost" onclick="home()">回到首页</button>';
  set(h);
}

/* ── 深潜：身体 → 空间 → 想要分离 → 找「我」 ── */
var D={body:'',note:''};
var DK='release_deep_v1';
function dstore(){try{return JSON.parse(localStorage.getItem(DK)||'[]')}catch(e){return[]}}
function dbar(i){var p=Math.min(98,Math.round(i/14*100));
  return '<div class="top"><button class="back" onclick="back()">返回</button><div class="bar"><i style="width:'+p+'%"></i></div></div>';}
function dstage(i){return '<p class="stage">深潜 · '+i+'/12</p>';}

function dIntro(){
  D={body:'',note:''};
  var h=dbar(0)+'<p class="stage">深潜</p>';
  h+='<p class="lead">这条路不一样。</p>';
  h+='<p class="q">它不处理某件事。<br>它是往「我」这个感觉上看一眼。</p>';
  h+='<p class="note">大约 15 分钟。中间会停下来，不用赶。<br>身体 → 空间 → 想守住自己的那个动作 → 那个「我」，找得到吗。</p>';
  h+='<p class="note">走不下去，随时点返回，没有关系。</p>';
  h+='<div class="spacer"></div>';
  h+='<button class="big" onclick="go(\'d1\')">开始</button>';
  set(h);
}
function d1(){
  var h=dbar(1)+dstage(1);
  h+='<p class="q">先让身体松到它能松的程度就行。<br>不勉强。</p>';
  h+='<p class="lead" style="margin-top:4px">身上有没有一块地方，是有点紧的、有点不对劲的？</p>';
  h+='<div class="chips" style="margin-top:14px">';
  h+='<button class="chip" onclick="dChest()">胸口</button>';
  h+='<button class="chip" onclick="dGut()">胃</button>';
  h+='<button class="chip" onclick="dThroat()">喉咙</button>';
  h+='<button class="chip" onclick="dShoulder()">肩</button>';
  h+='<button class="chip" onclick="dNeck()">后颈</button>';
  h+='</div>';
  h+='<button class="ghost" onclick="dNone()">都不太紧，挑一处就好</button>';
  set(h);
}
function dChest(){D.body='胸口';go('d2')}
function dGut(){D.body='胃';go('d2')}
function dThroat(){D.body='喉咙';go('d2')}
function dShoulder(){D.body='肩';go('d2')}
function dNeck(){D.body='后颈';go('d2')}
function dNone(){D.body='一处没什么特别的地方';go('d2')}

function d2(){
  var h=dbar(2)+dstage(2);
  h+='<div class="ctx">在：'+esc(D.body)+'</div>';
  h+='<p class="q">就那一块。<br>不要它松开。</p>';
  h+='<p class="lead" style="margin-top:4px">你能欢迎那里的感受吗——就让它这样？</p>';
  h+=tm(30);
  h+='<div class="spacer"></div>';
  h+='<button class="big" onclick="go(\'d3\')">好</button>';
  set(h);
}
function d3(){
  var h=dbar(3)+dstage(3);
  h+='<p class="q">现在，能不能也欢迎——<br>这些感受<b>正在其中出现的那个空间</b>？</p>';
  h+='<p class="note">感觉不到空间的话，就欢迎你身体里<b>没有感受的那些部分</b>。<br>手背、小腿、耳后，哪儿都行。</p>';
  h+=tm(30);
  h+='<div class="spacer"></div>';
  h+='<button class="big" onclick="go(\'d4\')">好</button>';
  set(h);
}
function d4(){
  var h=dbar(4)+dstage(4);
  h+='<p class="q">再来一轮。</p>';
  h+='<p class="lead" style="margin-top:4px">感受 → 空间 → 感受 → 空间。<br>来回交替，不用数清楚。</p>';
  h+=tm(40);
  h+='<div class="spacer"></div>';
  h+='<button class="big" onclick="go(\'d5\')">好</button>';
  set(h);
}
function d5(){
  var h=dbar(5)+dstage(5);
  h+='<p class="q">现在把同样的事，<br>放到整个身体上。</p>';
  h+='<p class="note">整个身体，只是一堆感受。<br>而它们都在同一个空间里。</p>';
  h+=tm(40);
  h+='<div class="spacer"></div>';
  h+='<button class="big" onclick="go(\'d6\')">好</button>';
  set(h);
}
function d6(){
  var h=dbar(6)+dstage(6);
  h+='<p class="q">注意一件事：<br>身体和外面之间，有一条线吗？</p>';
  h+='<p class="note">不是皮肤的边——是「里面」和「外面」的那道分界。<br>真的找一下。</p>';
  h+='<div class="spacer"></div>';
  h+='<button class="big" onclick="go(\'d7\')">找不到</button>';
  h+='<button class="row" onclick="go(\'d7\')"><b>好像有</b></button>';
  set(h);
}
function d7(){
  var h=dbar(7)+dstage(7);
  h+='<p class="lead">再注意一个很微妙的动作。</p>';
  h+='<p class="q">想把自己守住。<br>想不被并进去。<br>想保持「我是我」。</p>';
  h+='<p class="note">这个动作，不需要你解释它。<br>只要看它有没有在动。</p>';
  h+='<div class="spacer"></div>';
  h+='<button class="big" onclick="go(\'d8\')">有</button>';
  h+='<button class="ghost" onclick="toast(\'没有也没关系，往下走\');go(\'d8\')">不太有</button>';
  set(h);
}
function d8(){
  var h=dbar(8)+dstage(8);
  h+='<p class="q">这个「想守住自己」——<br>你能允许它在吗？</p>';
  h+='<div class="spacer"></div>';
  h+='<button class="big" onclick="go(\'d9\')">能</button>';
  h+='<button class="ghost" onclick="toast(\'可以。往下走\');go(\'d9\')">不能</button>';
  set(h);
}
function d9(){
  var h=dbar(9)+dstage(9);
  h+='<p class="q">能放下它吗？</p>';
  h+='<p class="note">认出来的一瞬间，它常常自己就走。<br>不用使劲。</p>';
  h+='<div class="spacer"></div>';
  h+='<button class="big" onclick="go(\'d10\')">能</button>';
  h+='<button class="row" onclick="go(\'d10\')"><b>还不能</b></button>';
  h+='<button class="row" onclick="go(\'d10\')"><b>说不清</b></button>';
  set(h);
}
function d10(){
  var h=dbar(10)+dstage(10);
  h+='<p class="lead">也看看反面。</p>';
  h+='<p class="q">有没有一种——<br>特别想融进去、想属于什么、<br>想说「让我属于这里」？</p>';
  h+='<p class="note">这是同一枚硬币的另一面。<br>修行的人容易掉在这里：<b>追合一，本身就是「想要合一」</b>。</p>';
  h+='<div class="spacer"></div>';
  h+='<button class="big" onclick="go(\'d11\')">有</button>';
  h+='<button class="ghost" onclick="go(\'d11\')">没有</button>';
  set(h);
}
function d11(){
  var h=dbar(11)+dstage(11);
  h+='<p class="q">这个也能放下吗？</p>';
  h+='<div class="spacer"></div>';
  h+='<button class="big" onclick="go(\'d12\')">能</button>';
  h+='<button class="ghost" onclick="go(\'d12\')">还不能</button>';
  set(h);
}
function d12(){
  var h=dbar(12)+dstage(12);
  h+='<p class="lead">最后一件事。</p>';
  h+='<p class="q">有没有一个「我」，<br>是独立于这一切的——<br>独立于身体、念头、这个空间？</p>';
  h+='<div class="spacer"></div>';
  h+='<button class="big" onclick="go(\'d13a\')">找到了</button>';
  h+='<button class="row" onclick="go(\'d13\')"><b>找不到</b></button>';
  h+='<button class="row" onclick="go(\'d13\')"><b>我不确定</b></button>';
  set(h);
}
function d13a(){
  var h=dbar(12)+dstage(12);
  h+='<p class="q">那就指出来。<br>它在哪？</p>';
  h+='<p class="note">在身体里？在脑子里？在某个位置？<br>不用说出名字，指一下就行。</p>';
  h+='<div class="spacer"></div>';
  h+='<button class="big" onclick="go(\'d13\')">指不出来</button>';
  h+='<button class="ghost" onclick="go(\'d13\')">好像还能指</button>';
  set(h);
}
function d13(){
  var h=dbar(13)+'<p class="stage">就到这儿</p>';
  h+='<p class="lead">不是你变成了什么。</p>';
  h+='<p class="q">是那个「独立的我」——<br>你从来没找到过。</p>';
  h+='<p class="note">注意：现在还在的，是什么？</p>';
  h+='<div class="spacer"></div>';
  h+='<button class="big" onclick="go(\'d14\')">有一个「在」</button>';
  h+='<button class="row" onclick="go(\'d14\')"><b>说不上</b></button>';
  set(h);
}
function d14(){
  var h=dbar(14)+'<p class="stage">完</p>';
  h+='<p class="q">这必须是够的。<br>就是现在这个。</p>';
  h+='<p class="lead" style="margin-top:4px">够，就够了。</p>';
  h+='<p class="note" style="margin-top:16px">如果有哪一句落下来了，记一句。</p>';
  h+='<textarea id="dn" rows="3" placeholder="例：找不到那个「我」，但「找不到」很清楚"></textarea>';
  h+='<button class="big" onclick="saveDeep()">记下</button>';
  h+='<button class="ghost" onclick="home()">不记，结束</button>';
  set(h);
}
function saveDeep(){
  var v=(document.getElementById('dn').value||'').trim();
  if(!v){toast('写一句就够');return}
  var a=dstore();
  a.push({d:new Date().toLocaleDateString('zh-CN'),body:D.body,note:v});
  try{localStorage.setItem(DK,JSON.stringify(a))}catch(e){}
  toast('记下了');home();
}

home();
</script>
</body>
</html>
